{% extends 'administrator/base.html' %}
{% load static %}
{% block title %}Sneakee | Add Product Variant{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/addproduct.css' %}">
    <script src="{% static 'js/addproductvariant.js' %}"></script>
</head>
<body>

<div class="content-area">
    <div class="form-container">
        <div class="form-box">

            <!-- Heading with Back Link -->
            <div class="form-header">
                <h2>Add Product Variant</h2>
                <a href="#" class="back-link">&larr; Back</a>
            </div>

            {% if messages %}
            <div class="message-container">
                {% for message in messages %}
                <div class="alert {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data" action="#">
                {% csrf_token %}
                <!-- Row 1: Select Product + Variant Name -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <select name="product" required>
                            <option disabled selected>Select Product</option>
                            {% for product in products %}
                            <option value="{{ product.id }}">{{ product.name }}</option>
                            {% endfor %}
                        </select>
                        <span class="error-message" id="product_error"></span>
                    </div>

                    <div class="form-group half-width">
                        <input type="text" name="variant_name" placeholder="Variant Name">
                        <span class="error-message" id="variant_name_error"></span>
                    </div>
                </div>

                <!-- Row 2: Color + Size -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <input type="text" name="color" placeholder="Color">
                        <span class="error-message" id="color_error"></span>
                    </div>

                    <div class="form-group half-width">
                        <input type="text" name="size" placeholder="Size">
                        <span class="error-message" id="size_error"></span>
                    </div>
                </div>

                <!-- Row 3: Stock + SKU -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <input type="number" name="stock" placeholder="Stock" min="0">
                        <span class="error-message" id="stock_error"></span>
                    </div>

                    <div class="form-group half-width">
                        <input type="text" name="sku" placeholder="SKU (optional)">
                        <span class="error-message" id="sku_error"></span>
                    </div>
                </div>

                <!-- Section Label for Images (This matches Add Product Main Image style) -->
                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Variant Images (Recommended: 800×800px)</label>
                    </div>
                </div>

                <!-- Row 4: Front + Top -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <label>Front Image</label>
                        <input type="file" name="front_image">
                        <span class="error-message" id="front_image_error"></span>
                    </div>

                    <div class="form-group half-width">
                        <label>Top Image</label>
                        <input type="file" name="top_image">
                        <span class="error-message" id="top_image_error"></span>
                    </div>
                </div>

                <!-- Row 5: Right + Left -->
                <div class="form-row">
                    <div class="form-group half-width">
                        <label>Right Image</label>
                        <input type="file" name="right_image">
                        <span class="error-message" id="right_image_error"></span>
                    </div>

                    <div class="form-group half-width">
                        <label>Left Image</label>
                        <input type="file" name="left_image">
                        <span class="error-message" id="left_image_error"></span>
                    </div>
                </div>

                <!-- Row 6: Back (full width) -->
                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Back Image</label>
                        <input type="file" name="back_image">
                        <span class="error-message" id="back_image_error"></span>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Add Variant</button>
            </form>

        </div>
    </div>
</div>

</body>
</html>
{% endblock %}
